name: Website quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Validate static website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Run Linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build Static Site
        # This will output static files to the /out directory
        run: npm run build

      # Cloudflare Pages builds and deploys through its GitHub integration.
      # main is production; pull requests receive preview deployments.
