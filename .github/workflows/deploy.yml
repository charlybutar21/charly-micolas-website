name: CI/CD Pipeline (cPanel FTP Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Static Site
        # This will output static files to the /out directory
        run: npm run build

      - name: Deploy to cPanel via FTP
        # Only deploy when pushing to main (not on pull requests)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path inside the repository to upload (Next.js static export folder)
          local-dir: ./out/
          # Path on the server where the files should go (usually public_html or the domain root)
          server-dir: ./public_html/
